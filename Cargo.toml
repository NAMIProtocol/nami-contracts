[workspace]
members = ["packages/*", "contracts/*"]

# Resolver has to be set explicitely in workspaces, see https://github.com/rust-lang/cargo/issues/9956
resolver = "2"


[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anybuf = "0.5"
cosmwasm-schema = "2.1.0"
cosmwasm-std = { version = "2.1.0", features = ["cosmwasm_2_0"] }
cw-utils = "2.0.0"
cw-storage-plus = "2.0.0"
cw-multi-test = { version = "2.0.0", features = ["cosmwasm_2_0"] }
cw2 = "2.0.0"
schemars = "0.8.16"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.58" }
rujira-rs = { path = "./packages/rujira-rs" }
nami-rs = { path = "./packages/nami-rs" }
rujira-rs-testing = { path = "./packages/rujira-rs-testing" }
rujira-ghost-vault = { path = "./contracts/rujira-ghost-vault" }
nami-asset-controller = { path = "./contracts/nami-asset-controller" }
nami-stable-swap = { path = "./contracts/nami-stable-swap" }
nami-variant-vault = { path = "./contracts/nami-variant-vault" }
nami-ghost-adapter = { path = "./contracts/nami-ghost-adapter" }
anyhow = "1"
prost = "0.13"
regex = "1.11.1"
itertools = "0.14.0"
postcard = "1.1.1"
cosmwasm-schema-derive = "2.1.3"
cosmos-sdk-proto = { version = "0.26.1", default-features = false, features = [
    "cosmwasm",
] }

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
